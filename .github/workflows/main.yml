name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Auto-Fix Android, WhatsApp Reader, Widgets & Gradle (v14 PRO)
        run: |
          python3 - << 'PYEOF'
          import os, shutil, base64

          for stray in [
              "build.gradle",
              "build.gradle.kts",
              "settings.gradle",
              "settings.gradle.kts",
              "android/build.gradle.kts",
              "android/settings.gradle.kts",
              "android/app/build.gradle.kts",
          ]:
              if os.path.exists(stray):
                  os.remove(stray)

          files = {
              "android/build.gradle": "",
              "android/gradle.properties": "",
              "android/settings.gradle": "",
              "android/gradle/wrapper/gradle-wrapper.properties": "ZGlzdHJpYnV0aW9uQmFzZT1HUkFETEVfVVNFUl9IT01FCmRpc3RyaWJ1dGlvblBhdGg9d3JhcHBlci9kaXN0cwp6aXBTdG9yZUJhc2U9R1JBRExFX1VTRVJfSE9NRQp6aXBTdG9yZVBhdGg9d3JhcHBlci9kaXN0cwpkaXN0cmlidXRpb25Vcmw9aHR0cHNcOi8vc2VydmljZXMuZ3JhZGxlLm9yZy9kaXN0cmlidXRpb25zL2dyYWRsZS04LjExLjEtYWxsLnppcAo=",
              "android/app/build.gradle": "",
              "android/app/proguard-rules.pro": "",
              "android/app/src/main/AndroidManifest.xml": "",
              "android/app/src/main/kotlin/com/rafeeqy/app/MainActivity.kt": "",
              "android/app/src/main/kotlin/com/rafeeqy/app/SmsReceiver.kt": "",
              "android/app/src/main/kotlin/com/rafeeqy/app/RafeeqyWidgetProviders.kt": "",
              "android/app/src/main/kotlin/com/rafeeqy/app/WhatsAppNotificationListener.kt": "",
              "android/app/src/main/res/values/strings.xml": "",
              "android/app/src/main/res/drawable/widget_bg_default.xml": "",
              "android/app/src/main/res/drawable/launch_background.xml": "",
              "android/app/src/main/res/xml/data_extraction_rules.xml": "",
          }

          for rel_path, b64_data in files.items():
              os.makedirs(os.path.dirname(rel_path), exist_ok=True)
              with open(rel_path, "wb") as f:
                  f.write(base64.b64decode(b64_data))

          res = "android/app/src/main/res"
          os.makedirs(f"{res}/xml", exist_ok=True)
          os.makedirs(f"{res}/drawable", exist_ok=True)

          moves = [
              (f"{res}/network_security_config.xml xml", f"{res}/xml/network_security_config.xml"),
              (f"{res}/file_paths.xml", f"{res}/xml/file_paths.xml"),
              (f"{res}/backup_rules.xml", f"{res}/xml/backup_rules.xml"),
              (f"{res}/rafeeqy_small_widget_info.xml", f"{res}/xml/rafeeqy_small_widget_info.xml"),
              (f"{res}/home_widget_provider_info.xml", f"{res}/xml/home_widget_provider_info.xml"),
              (f"{res}/drawableic_stat_rafeeqy.xml", f"{res}/drawable/ic_stat_rafeeqy.xml"),
              (f"{res}/drawable/widget_button_bg.xm", f"{res}/drawable/widget_button_bg.xml"),
          ]
          for src, dst in moves:
              if os.path.exists(src):
                  shutil.move(src, dst)

          fallback_icon_bytes = base64.b64decode("")
          icon_bytes = None
          for candidate in [f"{res}/drawable/ic_launcher.png", f"{res}/ic_launcher.png", "ic_launcher.png"]:
              if os.path.exists(candidate):
                  with open(candidate, "rb") as f:
                      icon_bytes = f.read()
                  break
          if not icon_bytes:
              icon_bytes = fallback_icon_bytes

          with open(f"{res}/drawable/ic_launcher.png", "wb") as f:
              f.write(icon_bytes)

          for d in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              os.makedirs(f"{res}/{d}", exist_ok=True)
              with open(f"{res}/{d}/ic_launcher.png", "wb") as f:
                  f.write(icon_bytes)
              with open(f"{res}/{d}/ic_launcher_round.png", "wb") as f:
                  f.write(icon_bytes)

          if os.path.exists(f"{res}/ic_launcher.png"):
              os.remove(f"{res}/ic_launcher.png")

          for old_kt in [
              "android/app/src/main/kotlin/MainActivity.kt",
              "android/app/src/main/kotlin/SmsReceiver.kt",
          ]:
              if os.path.exists(old_kt):
                  os.remove(old_kt)
          if os.path.exists("android/app/src/main/kotlin/com/yossefjoo"):
              shutil.rmtree("android/app/src/main/kotlin/com/yossefjoo")

          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  pub = f.read()
              if "dependency_overrides:" not in pub:
                  pub = pub.rstrip() + "\n\ndependency_overrides:\n  image: 4.3.0\n  archive: 3.6.1\n"
                  with open("pubspec.yaml", "w", encoding="utf-8") as f:
                      f.write(pub)

          print("v14 PRO Android resources, WhatsApp Listener, Widgets, and Gradle configs verified!")
          PYEOF

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: 🔧 Enable Android
        run: flutter config --enable-android

      - name: 🧹 Clean
        run: flutter clean

      - name: 📚 Get dependencies
        run: flutter pub get

      - name: 🔨 Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
