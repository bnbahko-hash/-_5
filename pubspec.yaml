publish_to: 'none'
version: 12.0.0+1200

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── Core ────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ─── Storage ─────────────────────────────────────────────
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # ─── Device & System ─────────────────────────────────────
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.2
  connectivity_plus: ^6.0.5
  network_info_plus: ^6.0.2
  package_info_plus: ^8.1.1

  # ─── UI & Interaction ────────────────────────────────────
  local_auth: ^2.3.0
  flutter_contacts: ^1.1.9+2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  android_intent_plus: ^5.0.0

  # ─── Ads ─────────────────────────────────────────────────
  google_mobile_ads: ^5.2.0

  # ─── Widgets ─────────────────────────────────────────────
  home_widget: ^0.7.0

  # ─── Media & Files ───────────────────────────────────────
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0

  # ─── PDF & Documents ─────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.2
  syncfusion_flutter_pdfviewer: ^28.2.12   # ✅ محدّث

  # ─── OCR ─────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.13.0

  # ─── Network ─────────────────────────────────────────────
  http: ^1.2.2

  # ─── Utils ───────────────────────────────────────────────
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

